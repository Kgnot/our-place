[versions]
springBoot = "3.5.3"
springDependencyManagement = "1.1.7"
#springCloud = "2025.1.2"
springCloud = "2025.0.3"   # ← Para Spring Boot 3.5.x

awsSdkBom = "2.29.51"
thumbnailator = "0.4.20"
metadataExtractor = "2.19.0"
#imgscalrLib = "4.2"
commonsIo = "2.15.1"
commonsFileupload = "1.5"
commonsLang3 = "3.14.0"
mockitoInline = "5.2.0"

jodaTime = "2.12.7"
jjwt = "0.12.5"

hibernateSpatial = "6.4.4.Final"
jtsCore = "1.19.0"
geotools = "31.1"
jedis = "5.1.0"

caffeine = "3.1.8"
springdocOpenapi = "2.3.0"

archunit= "1.2.1"
[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }

[libraries]
# --- Arch unit
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# --- Spring Boot starters (versión gestionada por el BOM de Spring Boot) ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
#spring-boot-starter-data-rest = { module = "org.springframework.boot:spring-boot-starter-data-rest" }
#spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-cache = { module = "org.springframework.boot:spring-boot-starter-cache" }
#spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-logging = { module = "org.springframework.boot:spring-boot-starter-logging" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-websocket-test = { module = "org.springframework.boot:spring-boot-starter-websocket-test" }

# --- Spring Security ---
spring-security-oauth2-resource-server = { module = "org.springframework.security:spring-security-oauth2-resource-server" }
spring-security-oauth2-jose = { module = "org.springframework.security:spring-security-oauth2-jose" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }

# --- Spring Data ---
spring-data-envers = { module = "org.springframework.data:spring-data-envers" }

# --- Spring Cloud ---
spring-cloud-starter-circuitbreaker-resilience4j = { module = "org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j" }
#spring-cloud-starter-netflix-eureka-client = { module = "org.springframework.cloud:spring-cloud-starter-netflix-eureka-client" }

# --- Base de datos ---
postgresql = { module = "org.postgresql:postgresql" }
h2 = { module = "com.h2database:h2" }

# --- AWS SDK v2 (compatible con R2) ---
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdkBom" }
aws-s3 = { module = "software.amazon.awssdk:s3" }
aws-s3-transfer-manager = { module = "software.amazon.awssdk:s3-transfer-manager" }
aws-auth = { module = "software.amazon.awssdk:auth" }

# --- Procesamiento de imágenes ---
thumbnailator = { module = "net.coobird:thumbnailator", version.ref = "thumbnailator" }
metadata-extractor = { module = "com.drewnoakes:metadata-extractor", version.ref = "metadataExtractor" }

# --- Manejo de archivos / utilidades ---
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIo" }
commons-fileupload = { module = "commons-fileupload:commons-fileupload", version.ref = "commonsFileupload" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }

# --- Fecha y hora ---
joda-time = { module = "joda-time:joda-time", version.ref = "jodaTime" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

# --- JWT (Identity) ---
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# --- Geoespacial (Map) ---
hibernate-spatial = { module = "org.hibernate.orm:hibernate-spatial", version.ref = "hibernateSpatial" }
jts-core = { module = "org.locationtech.jts:jts-core", version.ref = "jtsCore" }
geotools-main = { module = "org.geotools:gt-main", version.ref = "geotools" }
geotools-epsg-hsql = { module = "org.geotools:gt-epsg-hsql", version.ref = "geotools" }
geotools-referencing = { module = "org.geotools:gt-referencing", version.ref = "geotools" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }

# --- Resiliencia y caché ---
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# --- Documentación de API ---
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdocOpenapi" }

# --- Email (worker) ---
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf" }

# --- Monitoreo ---
micrometer-new-relic = { module = "io.micrometer:micrometer-registry-new-relic" }

# --- Lombok ---
lombok = { module = "org.projectlombok:lombok" }

# --- Testing ---
reactor-test = { module = "io.projectreactor:reactor-test" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockitoInline" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[bundles]
#image-processing = ["thumbnailator", "imgscalr"]
file-handling = ["commons-io", "commons-fileupload"]
geospatial = ["hibernate-spatial", "jts-core", "geotools-main", "geotools-epsg-hsql", "geotools-referencing"]