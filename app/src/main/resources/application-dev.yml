spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, env, beans, mappings

app:
  cors:
    allowed-origins:
      - "http://localhost:4000"
      - "http://192.168.1.5:4000"