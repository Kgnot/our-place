plugins {
    alias(libs.plugins.springBoot)
    alias(libs.plugins.springDependencyManagement)
}

description = 'Main Application - Entry point for the Our Place backend services'

dependencies {
    // propias
    implementation project(':core:common')
    implementation project(':core:identity')
    implementation project(':core:billing')
    implementation project(':shared')
    // Lo específico de emitir/validar JWT — SOLO identity lo necesita
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    implementation libs.spring.security.crypto
    implementation libs.spring.data.envers
}

bootJar {
    mainClass = 'org.our_place.ourplacebackend.OurPlaceBackendApplication'
}

jar {
    enabled = false
}

