plugins {
    id 'java'
    alias(libs.plugins.springBoot)
    alias(libs.plugins.springDependencyManagement)
}

allprojects {
    group = 'org.our_place'
    version = '0.0.1-SNAPSHOT'
    description = 'our-place-backend'

    repositories {
        mavenCentral()
        maven {
            name = 'osgeo'
            url='https://repo.osgeo.org/repository/release/'
        }
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

repositories {
    mavenCentral()
}


configure(subprojects.findAll { it.name in
        ['billing', 'calendar', 'common', 'gallery', 'identity', 'map', 'notification', 'room', 'app','shared'] }) {

    plugins.withId('io.spring.dependency-management') {
        dependencyManagement {
            imports {
                mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloud.get()}"
            }
        }
    }

    // Esperamos a que el propio build.gradle del subproyecto aplique el plugin de Spring Boot
    // (vía alias(libs.plugins.springBoot)). Antes de eso, configuraciones como
    // 'developmentOnly' o 'annotationProcessor' todavía no existen en el proyecto.
    plugins.withId('org.springframework.boot') {
        dependencies {
            implementation libs.spring.boot.starter.web
            implementation libs.spring.boot.starter.data.jpa
            implementation libs.spring.boot.starter.validation

            runtimeOnly libs.postgresql

            implementation libs.spring.boot.starter.actuator
            runtimeOnly libs.micrometer.new.relic

            implementation libs.spring.boot.starter.security

            implementation libs.spring.cloud.starter.circuitbreaker.resilience4j

            implementation libs.spring.boot.starter.cache
            implementation libs.caffeine

            implementation libs.springdoc.openapi
            implementation libs.commons.lang3

            compileOnly libs.lombok
            annotationProcessor libs.lombok

            developmentOnly libs.spring.boot.devtools

            testImplementation libs.spring.boot.starter.test
            testImplementation libs.spring.boot.starter.data.jpa.test
            testImplementation libs.h2
            testImplementation libs.junit.platform.launcher
            testCompileOnly libs.lombok
            testAnnotationProcessor libs.lombok
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloud.get()}"
    }
}